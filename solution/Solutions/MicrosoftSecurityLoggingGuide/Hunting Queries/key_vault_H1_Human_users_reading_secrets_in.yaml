id: 7008e034-6378-5776-8938-9ab41ec78a2c
name: 'Azure Key Vault - Human users reading secrets in production vaults over the last 7 days'
description: |
  - **Vaults without recent logs.** Diff your Azure Resource Graph list of microsoft.keyvault/vaults against distinct _ResourceId values in AZKVAuditLogs and AzureDiagnostics to catch newly deployed vaults missing diagnostic settings. Source guide: azure/key-vault/README.md.
requiredDataConnectors:
  - connectorId: AzureKeyVault
    dataTypes:
      - AZKVAuditLogs
tactics:
  - Discovery
query: |
  // Hunt: Human users reading secrets in production vaults over the last 7 days
  // ASSUMPTION: Production vault names include "prod" and Identity JSON contains claim.upn.
  AZKVAuditLogs
  | where TimeGenerated > ago(7d)
  | where OperationName == "SecretGet"
  | where _ResourceId has "prod"
  | extend UserUpn = tostring(parse_json(Identity).claim.upn)
  | where isnotempty(UserUpn)
  | summarize Reads = count(), DistinctSecrets = dcount(RequestUri),
              IPs = make_set(CallerIpAddress, 5) by UserUpn, _ResourceId
  | order by DistinctSecrets desc
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: UserUpn
  - entityType: AzureResource
    fieldMappings:
      - identifier: ResourceId
        columnName: _ResourceId
version: 1.0.0
