id: 75d65da4-eb14-5018-a94b-f145530c56d5
name: 'Foundry (formerly Azure AI Foundry) and Azure OpenAI - Azure OpenAI or Foundry API keys listed or regenerated by unexpected c...'
description: |
  Listing keys (listKeys/action) lets an attacker bypass Entra ID RBAC and call models directly from anywhere if local auth isn't disabled. MITRE ATT&CK: Credential Access T1552 (Unsecured Credentials) and T1528. Source guide: ai/azure-openai-ai-foundry/README.md (C1).
severity: High
status: Available
requiredDataConnectors:
  - connectorId: AzureActivity
    dataTypes:
      - AzureActivity
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1528
  - T1552
query: |
  // CUSTOM - API keys listed or regenerated on a Microsoft Foundry or Azure OpenAI account
  // ASSUMPTION: OperationNameValue strings match standard Microsoft.CognitiveServices ARM actions.
  // Verify exact values in your tenant with:
  //   AzureActivity | where ResourceProviderValue =~ "Microsoft.CognitiveServices" | distinct OperationNameValue
  let approved_callers = dynamic(["platform-deployer-spn"]);
  AzureActivity
  | where TimeGenerated > ago(1h)
  | where ResourceProviderValue =~ "Microsoft.CognitiveServices"
  | where OperationNameValue in~ (
      "Microsoft.CognitiveServices/accounts/listKeys/action",
      "Microsoft.CognitiveServices/accounts/regenerateKey/action"
  )
  | where ActivityStatusValue =~ "Success"
  | where Caller !in~ (approved_callers)
  | project TimeGenerated, Caller, CallerIpAddress, OperationNameValue, ResourceGroup, _ResourceId, Properties
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Caller
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: CallerIpAddress
  - entityType: AzureResource
    fieldMappings:
      - identifier: ResourceId
        columnName: _ResourceId
version: 1.0.0
kind: Scheduled
