id: 229c0b48-598b-50dd-a488-3468b65dd002
name: 'Google Cloud (optional) - GCP service account key created'
description: |
  MITRE: Persistence T1098.001 (Account Manipulation: Additional Cloud Credentials). Organisations enforcing Workload Identity Federation should treat any static service account key creation as high priority. Source guide: multi-cloud/google-cloud/README.md (C1).
severity: High
status: Available
requiredDataConnectors:
  - connectorId: GCPAuditLogs
    dataTypes:
      - GCPAuditLogs
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Persistence
relevantTechniques:
  - T1098.001
query: |
  // CUSTOM - Detects creation of a user-managed GCP service account key (common persistence path)
  // ASSUMPTION: GCPAuditLogs populates MethodName and PrincipalEmail per the standard table schema.
  GCPAuditLogs
  | where TimeGenerated > ago(1h)
  | where MethodName == "google.iam.admin.v1.CreateServiceAccountKey"
  | project TimeGenerated, ProjectId, PrincipalEmail, CallerIp, ResourceName, MethodName
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: PrincipalEmail
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: CallerIp
  - entityType: AzureResource
    fieldMappings:
      - identifier: ResourceId
        columnName: ResourceName
version: 1.0.0
kind: Scheduled
