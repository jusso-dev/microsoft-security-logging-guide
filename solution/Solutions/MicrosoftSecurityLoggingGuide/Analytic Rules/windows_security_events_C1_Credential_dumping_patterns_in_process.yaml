id: e8f4cfa5-2d15-55db-962c-ed678d11fd80
name: 'Windows security event logs (clients) - Credential dumping patterns in process creation'
description: |
  MITRE: Credential Access T1003. The comsvcs.dll MiniDump variant catches rundll32-based LSASS dumps that rename nothing. Source guide: endpoint/windows-security-events/README.md (C1).
severity: High
status: Available
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1003
query: |
  // CUSTOM - Known credential dumping command lines in 4688
  // ASSUMPTION: 4688 is collected AND the command line inclusion policy is on.
  // Without the policy the CommandLine field is empty and this rule is blind.
  SecurityEvent
  | where TimeGenerated > ago(1h)
  | where EventID == 4688
  | where isnotempty(CommandLine)
  | where CommandLine has_any ("procdump", "mimikatz", "sekurlsa", "lsass", "comsvcs.dll, minidump",
                               "comsvcs.dll,minidump", "ntds.dit")
      or NewProcessName has_any ("procdump", "procdump64", "mimikatz", "pypykatz", "secretsdump")
  | project TimeGenerated, Computer, SubjectUserName, ParentProcessName, NewProcessName, CommandLine
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: SubjectUserName
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: Computer
  - entityType: Process
    fieldMappings:
      - identifier: CommandLine
        columnName: CommandLine
version: 1.0.0
kind: Scheduled
