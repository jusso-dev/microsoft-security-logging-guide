id: 9fa41a7b-ad78-5f79-879d-6dc4d15d35f8
name: 'Azure App Service and Azure Functions - Publishing credentials fetched or basic auth re-enabled in Azure Activity'
description: |
  Catches someone exporting a publish profile (listpublishingcredentials) or turning FTP/SCM basic auth back on via Azure Resource Manager. MITRE: Credential Access, Unsecured Credentials T1552, Defense Evasion T1562. Source guide: azure/app-service-functions/README.md (C2).
severity: High
status: Available
requiredDataConnectors:
  - connectorId: AzureActivity
    dataTypes:
      - AzureActivity
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - DefenseEvasion
  - CredentialAccess
relevantTechniques:
  - T1552
  - T1562
query: |
  // CUSTOM - App Service publishing profile fetched or basic auth policy modified
  // ASSUMPTION: AzureActivity is connected for subscriptions hosting App Service and Function Apps.
  // Exclude approved CI/CD deployment service principals after baselining.
  let approved_callers = dynamic([]);
  AzureActivity
  | where TimeGenerated > ago(1h)
  | where ActivityStatusValue in ("Success", "Succeeded")
  | where OperationNameValue has_any (
      "Microsoft.Web/sites/config/listpublishingcredentials/action",
      "Microsoft.Web/sites/basicPublishingCredentialsPolicies/write",
      "Microsoft.Web/sites/publishxml/action"
  )
  | where Caller !in~ (approved_callers)
  | project TimeGenerated, Caller, CallerIpAddress, SubscriptionId, ResourceGroup,
            OperationNameValue, App = _ResourceId
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Caller
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: CallerIpAddress
version: 1.0.0
kind: Scheduled
