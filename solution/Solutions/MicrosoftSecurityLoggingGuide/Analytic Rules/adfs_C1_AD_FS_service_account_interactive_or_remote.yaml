id: 9a4d047c-9342-5c8b-9b6b-02fa3680c98e
name: 'Active Directory Federation Services (AD FS) - AD FS service account interactive or remote logon'
description: |
  Golden SAML preparation needs the AD FS service account's credentials on a workstation or over RDP. That account should only ever log on as a service, so any type 2 or type 10 logon is a finding. MITRE: Credential Access T1078 (Valid Accounts) leading to T1606 (Forge Web Credentials). If you use MDI action accounts or a gMSA, the same query works for the Entra Connect service account on sync servers. Source guide: identity/adfs/README.md (C1).
severity: High
status: Available
requiredDataConnectors:
  - connectorId: SecurityEvents
    dataTypes:
      - SecurityEvent
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
  - InitialAccess
relevantTechniques:
  - T1078
  - T1606
query: |
  // CUSTOM - interactive or RDP logon by the AD FS service account
  // ASSUMPTION: replace the list with your AD FS service account names.
  // A gMSA renders with a trailing dollar, for example ADFSSVC$.
  let adfs_service_accounts = dynamic(["adfssvc$", "ADFS-SVC$"]);
  SecurityEvent
  | where TimeGenerated > ago(1h)
  | where EventID == 4624
  | where LogonType in (2, 10)
  | where TargetUserName has_any (adfs_service_accounts)
  | project TimeGenerated, Computer, TargetUserName, LogonType, IpAddress, Process
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: TargetUserName
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: Computer
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IpAddress
version: 1.0.0
kind: Scheduled
