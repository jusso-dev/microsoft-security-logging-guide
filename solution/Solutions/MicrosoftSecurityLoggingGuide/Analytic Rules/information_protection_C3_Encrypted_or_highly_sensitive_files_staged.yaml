id: 4545d481-7355-5566-87d6-9e8a2d0ab33e
name: 'Purview Information Protection - Encrypted or highly sensitive files staged on endpoints'
description: |
  Defender XDR advanced hunting custom detection using DeviceFileEvents, where SensitivityLabel and IsAzureInfoProtectionApplied are already resolved to plain text. MITRE: Collection T1074 (Data Staged) and Exfiltration T1052. Source guide: data-security/information-protection/README.md (C3).
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: MicrosoftThreatProtection
    dataTypes:
      - DeviceFileEvents
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Collection
  - Exfiltration
relevantTechniques:
  - T1052
  - T1074
query: |
  // CUSTOM - Defender XDR custom detection for labelled or encrypted files copied to staging or removable paths
  // ASSUMPTION: Replace "Highly Confidential" with your organisation's top sensitivity label display name.
  DeviceFileEvents
  | where TimeGenerated > ago(1h)
  | where SensitivityLabel has "Highly Confidential" or IsAzureInfoProtectionApplied == true
  | where ActionType in ("FileCreated", "FileRenamed")
  | where FolderPath matches regex @"(?i)^([d-z]:\\|\\\\.*\\|.*\\(temp|public|downloads|staging)\\)"
  | summarize FileCount = count(), SampleFiles = make_set(FileName, 10),
              TimeGenerated = max(TimeGenerated), ReportId = any(ReportId)
      by DeviceId, DeviceName, InitiatingProcessAccountUpn, SensitivityLabel
  | where FileCount >= 10
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: InitiatingProcessAccountUpn
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: DeviceName
  - entityType: Host
    fieldMappings:
      - identifier: AzureID
        columnName: DeviceId
version: 1.0.0
kind: Scheduled
