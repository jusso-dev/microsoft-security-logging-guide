id: 38515c78-3ff8-5d83-bdcb-bde839290030
name: 'GitHub (Enterprise Cloud) - Secret scanning push protection bypassed or alert dismissed'
description: |
  Attackers and hurried developers alike bypass push protection or dismiss secret-scanning alerts. Alerting on every bypass gives the SOC immediate verification before leaked keys are abused. MITRE ATT&CK: Defense Evasion T1562.001 (Disable or Modify Tools) and Credential Access T1552.001. Source guide: devops/github/README.md (C2).
severity: High
status: Available
requiredDataConnectors:
  - connectorId: GitHubEnterpriseAuditLog
    dataTypes:
      - GitHubAuditData
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - DefenseEvasion
  - CredentialAccess
relevantTechniques:
  - T1552.001
  - T1562.001
query: |
  // CUSTOM - Secret scanning push protection bypass or secret alert resolution
  // ASSUMPTION: GitHub audit actions match GitHub Enterprise Cloud naming for secret scanning.
  // Verify exact Action values in your tenant before enabling.
  GitHubAuditData
  | where TimeGenerated > ago(1h)
  | where Action in~ (
      "secret_scanning_push_protection.bypass",
      "secret_scanning_alert.resolve",
      "repo.secret_scanning_push_protection_disable",
      "org.secret_scanning_push_protection_disable"
  )
  | project TimeGenerated, Actor, ActorIp, Org, Repo, Action
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Actor
version: 1.0.0
kind: Scheduled
