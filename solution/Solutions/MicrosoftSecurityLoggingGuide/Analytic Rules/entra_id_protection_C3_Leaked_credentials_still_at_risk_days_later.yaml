id: bb51bc6c-9c3b-5e24-81c0-67286eff6b7b
name: 'Entra ID Protection (risk detections) - Leaked credentials still at risk days later'
description: |
  Leaked credentials is always high risk and available without P2. A cloud password reset fully remediates it. A user still at risk days later means the reset never happened, or the attacker changed the password first. MITRE: Valid Accounts T1078. The fix is a password reset plus session revocation, which is exactly what the shipped playbooks do. Source guide: identity/entra-id-protection/README.md (C3).
severity: Medium
status: Available
requiredDataConnectors:
  - connectorId: AzureActiveDirectoryIdentityProtection
    dataTypes:
      - AADUserRiskEvents
queryFrequency: 1d
queryPeriod: 7d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
relevantTechniques:
  - T1078
query: |
  // CUSTOM - Leaked credentials detection with no remediation after 24 hours
  // ASSUMPTION: RiskEventType stores the Graph riskEventType string, leakedCredentials.
  // The catalogue documents the value for the Graph API. Verify against a sample row.
  AADUserRiskEvents
  | where TimeGenerated > ago(7d)
  | where RiskEventType == "leakedCredentials"
  | summarize FirstSeen = min(TimeGenerated), LatestState = arg_max(TimeGenerated, RiskState)
              by UserPrincipalName, UserId
  | where LatestState == "atRisk" and FirstSeen < ago(24h)
  | project FirstSeen, UserPrincipalName, UserId
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: UserPrincipalName
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: UserId
version: 1.0.0
kind: Scheduled
